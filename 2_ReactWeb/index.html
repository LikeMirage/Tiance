<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preload" href="/fonts/oxanium-tiance.ttf" as="font" type="font/ttf" crossorigin />
    <title>Tiance</title>
    <style>
      /* Oxanium SemiBold, limited to the Tiance wordmark; see fonts/oxanium-OFL.txt. */
      @font-face {
        font-family: "Oxanium";
        src: url("/fonts/oxanium-tiance.ttf") format("truetype");
        font-style: normal;
        font-weight: 600;
        font-display: block;
      }

      :root {
        color-scheme: light dark;
        --tiance-boot-surface-base: rgb(30, 30, 30);
        --tiance-boot-border-separator: rgba(255, 255, 255, 0.06);
        --tiance-boot-text-primary: #f3f4f7;
        --tiance-boot-text-muted: rgba(243, 244, 247, 0.48);
        --tiance-boot-accent: #dea059;
        --tiance-boot-accent-rgb: 222, 160, 89;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
      }

      body {
        background: var(--tiance-boot-surface-base);
        color: var(--tiance-boot-text-primary);
        overflow: hidden;
      }

      .tiance-boot-placeholder {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: var(--tiance-boot-surface-base);
        pointer-events: none;
      }

      .tiance-boot-placeholder__wordmark {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--tiance-boot-text-primary);
        font-family: "Oxanium", "Bahnschrift", sans-serif;
        font-size: clamp(80px, 12.5vw, 180px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.04em;
        user-select: none;
        animation: tiance-wordmark-breathe 2.8s ease-in-out infinite;
      }

      @keyframes tiance-wordmark-breathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .tiance-boot-placeholder__wordmark { animation: none; }
      }

      .tiance-boot-placeholder__status {
        position: absolute;
        bottom: max(24px, 5vh);
        left: 50%;
        width: min(560px, calc(100vw - 48px));
        margin: 0;
        color: var(--tiance-boot-text-muted);
        font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.08em;
        text-align: center;
        transform: translateX(-50%);
      }
    </style>
    <script>
      (() => {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const apiBaseUrl = hashParams.get("tianceApiBaseUrl");
        if (apiBaseUrl) {
          window.__tianceApiBaseUrl = apiBaseUrl;
        }

        const bootStatus = hashParams.get("tianceBootStatus");
        if (bootStatus) {
          window.__tianceBootStatus = bootStatus;
        }

        const bootTheme = hashParams.get("tianceBootTheme");
        if (!bootTheme) return;

        try {
          const theme = JSON.parse(bootTheme);
          const root = document.documentElement;
          if (theme.mode === "dark" || theme.mode === "light") {
            root.dataset.bootThemeMode = theme.mode;
            root.style.colorScheme = theme.mode;
          }
          if (typeof theme.surfaceBase === "string" && theme.surfaceBase.trim()) {
            root.style.setProperty("--tiance-boot-surface-base", theme.surfaceBase);
            root.style.setProperty("--color-surface-base", theme.surfaceBase);
          }
          if (typeof theme.borderSeparator === "string" && theme.borderSeparator.trim()) {
            root.style.setProperty("--tiance-boot-border-separator", theme.borderSeparator);
          }
          if (typeof theme.textPrimary === "string" && theme.textPrimary.trim()) {
            root.style.setProperty("--tiance-boot-text-primary", theme.textPrimary);
            root.style.setProperty("--color-text-primary", theme.textPrimary);
          }
          if (typeof theme.textMuted === "string" && theme.textMuted.trim()) {
            root.style.setProperty("--tiance-boot-text-muted", theme.textMuted);
          }
          if (typeof theme.accent === "string" && theme.accent.trim()) {
            root.style.setProperty("--tiance-boot-accent", theme.accent);
          }
          if (typeof theme.accentRgb === "string" && theme.accentRgb.trim()) {
            root.style.setProperty("--tiance-boot-accent-rgb", theme.accentRgb);
          }
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        } catch (_error) {
          // 启动背景不能影响应用主流程。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="tiance-boot-placeholder" class="tiance-boot-placeholder" aria-label="Tiance 正在启动">
      <div class="tiance-boot-placeholder__wordmark">Tiance</div>
      <p class="tiance-boot-placeholder__status" role="status">正在加载界面</p>
    </div>
    <script>
      (() => {
        const status = window.__tianceBootStatus;
        if (typeof status !== "string" || !status.trim()) return;
        const element = document.querySelector(".tiance-boot-placeholder__status");
        if (element) element.textContent = status;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
